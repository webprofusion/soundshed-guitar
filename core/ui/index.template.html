  <script>
    /*
      Android only: bootstrap JUCE's JavaScript integration layer.

      On desktop, JUCE injects its integration script natively before any page
      script runs — WebView2's AddScriptToExecuteOnDocumentCreated, WKUserScript
      on Apple platforms, WebKitGTK's user content manager. android.webkit.WebView
      has no equivalent API, so JUCE instead hands the scripts to the page through
      window.__JUCE__.getAndroidUserScripts() and expects the page to evaluate
      them itself (see lowLevelIntegrationsScript in juce_WebBrowserComponent.cpp).

      Without this, window.__JUCE__ stays the bare Java interface object, so
      window.__JUCE__.backend and window.IPlugSendMsg never exist and the UI
      cannot send a single message to the engine — it loads, renders, and then
      sits there with an empty preset library.

      The inAndroidUserScriptEval flag is what JUCE's own script checks to avoid
      recursing back into this same eval. Inert on every other platform, where
      getAndroidUserScripts is undefined.
    */
    if (
      typeof window.__JUCE__ !== "undefined" &&
      typeof window.__JUCE__.getAndroidUserScripts !== "undefined" &&
      typeof window.inAndroidUserScriptEval === "undefined"
    ) {
      window.inAndroidUserScriptEval = true;
      eval(window.__JUCE__.getAndroidUserScripts());
      delete window.inAndroidUserScriptEval;
    }
  </script>
  <script>
    /*
      Display density, applied before first paint.

      ts/compactMode.ts owns this for the rest of the session — it also accounts
      for the UI zoom setting and for the user's stored Auto/Compact/Full
      preference, neither of which is known this early. This runs only so the
      first frame is already laid out at the right density instead of painting
      the desktop shell and reflowing to the compact one a moment later.

      The two thresholds must match COMPACT_MAX_WIDTH / COMPACT_MAX_HEIGHT, the
      landscape test must match compactLayoutForViewport, and the split test must
      match compactSplitForViewport: a wrong guess at the layout paints the
      navigation on the wrong edge for a frame, which is the reflow this is here
      to prevent.
    */
    (function () {
      var root = document.documentElement;
      var width = window.innerWidth;
      var height = window.innerHeight;
      var compact = width <= 980 || height <= 620;
      root.dataset.density = compact ? "compact" : "full";
      if (compact) {
        root.dataset.compactLayout = width > height ? "rail" : "stack";
        if (width <= height && width >= 600 && height >= 800) {
          root.dataset.compactSplit = "";
        }
      }
    })();
  </script>
