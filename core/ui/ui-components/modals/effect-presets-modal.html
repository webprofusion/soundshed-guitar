<div id="effect-presets-modal" class="modal effect-presets-modal" style="display: none;">
      <div class="modal-content effect-presets-content" role="dialog" aria-modal="true" aria-labelledby="effect-presets-title">
        <div class="modal-header">
          <h3 id="effect-presets-title">Presets</h3>
          <button class="modal-close" id="effect-presets-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <p class="effect-presets-subtitle" id="effect-presets-subtitle"></p>
          <div id="effect-presets-lists"></div>
        </div>
        <div class="modal-footer effect-presets-footer">
          <label class="effect-presets-save-label" for="effect-presets-name">Save current settings as</label>
          <div class="effect-presets-save-row">
            <input type="text" id="effect-presets-name" class="effect-presets-name" placeholder="Preset name" aria-label="Name for the saved effect preset" />
            <button class="btn btn-primary" id="effect-presets-save" type="button">Save</button>
          </div>
        </div>
      </div>
    </div>
