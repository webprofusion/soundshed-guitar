      <div class="control-bar-group">
        <div class="vu-meter" id="input-vu-meter" title="Raw input peak level (dBFS)">
          <span class="vu-readout" id="input-vu-readout">-∞ dB</span>
          <div class="vu-segments" id="vu-segments">
            <div class="vu-seg vu-seg-red" data-db="-3"></div>
            <div class="vu-seg vu-seg-red" data-db="-6"></div>
            <div class="vu-seg vu-seg-yellow" data-db="-9"></div>
            <div class="vu-seg vu-seg-yellow" data-db="-12"></div>
            <div class="vu-seg vu-seg-yellow" data-db="-18"></div>
            <div class="vu-seg vu-seg-green" data-db="-24"></div>
            <div class="vu-seg vu-seg-green" data-db="-36"></div>
            <div class="vu-seg vu-seg-green" data-db="-48"></div>
            <div class="vu-peak-hold" id="vu-peak-hold"></div>
          </div>
          <button
            id="user-input-calibration-toolbar-trigger"
            class="input-vu-meter-dropdown-trigger"
            type="button"
            aria-label="Input calibration options"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="user-input-calibration-toolbar-menu"
            title="Input calibration options"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3.5 5.75 8 10.25l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div id="user-input-calibration-toolbar-menu" class="input-calibration-toolbar-menu" role="menu" hidden></div>
        </div>
        <div class="control-stack control-stack-knob">
          <div class="control-stack-label">IN</div>
          <div class="knob-control" id="input-control" title="Input Level">
            <div class="knob" data-param="input" data-value="0">
              <div class="knob-indicator"></div>
            </div>
            <span class="knob-value" id="input-value">+0.0 dB</span>
          </div>
        </div>

        <div class="control-stack input-mode-control">
          <div class="control-stack-label">INPUT</div>
          <div class="input-channel-selector">
            <select id="input-mode-select" title="How the inputs reach the chain">
              <option value="mono1" selected>Mono · In 1</option>
              <option value="mono2">Mono · In 2</option>
              <option value="monoSum">Mono · 1+2</option>
              <option value="stereo">Stereo</option>
              <option value="dualMono">Dual mono</option>
            </select>
          </div>
          <span class="input-mode-status" id="input-mode-status">MONO</span>
        </div>

        <div class="control-stack control-stack-knob gate-control-stack">
          <div class="toggle-control mini-toggle-control">
            <span class="toggle-label">GATE</span>
            <label class="toggle-switch">
              <input type="checkbox" id="gate-toggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="knob-control has-flyout-trigger" id="gate-threshold-control" title="Gate Threshold">
            <div class="knob" data-param="gate_threshold" data-value="-60">
              <div class="knob-indicator"></div>
            </div>
            <div class="knob-value-row">
              <span class="knob-value" id="gate-threshold-value">-60 dB</span>
              <button
                id="gate-settings-trigger"
                class="gate-settings-trigger"
                type="button"
                aria-label="Noise gate settings"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="gate-settings-flyout"
                title="Noise gate settings"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M3.5 5.75 8 10.25l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
          <div
            id="gate-settings-flyout"
            class="gate-settings-flyout"
            role="dialog"
            aria-label="Noise gate settings"
            hidden
          ></div>
        </div>

        <div class="control-stack control-stack-knob transpose-control-stack">
          <div class="control-stack-label">TRANSPOSE</div>
          <div class="knob-control">
            <div class="knob" data-param="transpose" data-value="0">
              <div class="knob-indicator"></div>
            </div>
            <span class="knob-value" id="transpose-value">0 st</span>
          </div>
        </div>

        <div class="control-stack eq-control">
          <div class="toggle-control mini-toggle-control">
            <span class="toggle-label">EQ</span>
            <label class="toggle-switch">
              <input type="checkbox" id="eq-toggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <button class="eq-icon-btn panel-switch" data-panel="eq" title="EQ">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 21v-7M12 21V3M20 21v-11" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
          </button>
        </div>

      </div>
