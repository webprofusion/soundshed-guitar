    <header class="icon-bar film-grain">
      <span class="app-title">Soundshed Guitar</span>
      <span class="icon-bar-spacer"></span>
      <nav class="nav-tabs" aria-label="Main navigation">
        <!--
          Chain and Effect exist for the compact landscape rail alone
          (html[data-compact-layout="rail"]), where they stand in for Play: the two
          halves of Play take turns at that size, and a button for each puts either
          one tap from anywhere. navigation.ts binds them; css/compact/rail.css
          shows them. The icons on Tones and Jam are the rail's too — the bars
          show only the words.
        -->
        <button class="nav-tab nav-rail-stage" type="button" data-compact-destination="chain" title="Signal chain">
          <svg class="nav-tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="2" y="9" width="5" height="6" rx="1.2" />
            <rect x="9.5" y="7" width="5" height="10" rx="1.2" />
            <rect x="17" y="9" width="5" height="6" rx="1.2" />
            <path d="M7 12h2.5M14.5 12H17" />
          </svg>
          <span class="nav-tab-label">Chain</span>
        </button>
        <button class="nav-tab nav-rail-stage" type="button" data-compact-destination="detail" title="Effect controls">
          <svg class="nav-tab-icon nav-tab-icon-effect" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="13.5" r="7" />
            <path d="M12 13.5 16 9.5" />
            <path d="M12 3v1.5M4.2 6.2l1.1 1.1M19.8 6.2l-1.1 1.1" />
          </svg>
          <svg class="nav-tab-icon nav-tab-icon-setlist" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
            <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
            <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
            <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
          </svg>
          <span class="nav-tab-label" data-compact-stage-detail-label>Effect</span>
        </button>
        <button class="icon-btn nav-tab" data-panel="visualizer" title="Play">PLAY</button>
        <button class="icon-btn nav-tab" data-panel="sharing" title="Tones">
          <svg class="nav-tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 17.5V5.5l11-2v12" />
            <circle cx="6.5" cy="17.5" r="2.5" />
            <circle cx="17.5" cy="15.5" r="2.5" />
          </svg>
          <span class="nav-tab-label">TONES</span>
        </button>
        <button class="icon-btn nav-tab" data-panel="jam" title="Jam">
          <svg class="nav-tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 17v-5a8 8 0 0 1 16 0v5" />
            <rect x="3" y="14" width="4.5" height="6.5" rx="1.5" />
            <rect x="16.5" y="14" width="4.5" height="6.5" rx="1.5" />
          </svg>
          <span class="nav-tab-label">JAM</span>
        </button>
      </nav>
      <span class="icon-bar-spacer"></span>
      <div class="jam-player-dock" id="jam-player-dock" aria-hidden="true"></div>
      <!-- Shown by updateCheck.ts when the update server names a newer release;
           opens #update-modal. Stays up for the session once shown. -->
      <button class="header-update-btn" id="header-update-btn" type="button" title="A new version is available" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 4v11" />
          <path d="m7 10 5 5 5-5" />
          <path d="M5 20h14" />
        </svg>
        <span class="header-update-label">Update <span id="header-update-version"></span></span>
      </button>
      <button class="icon-btn nav-settings-btn" data-panel="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" stroke="currentColor" stroke-width="1.5" fill="none" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.86l.03.03a2 2 0 0 1-2.83 2.83l-.03-.03A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.53V21a2 2 0 0 1-4 0v-.07a1.7 1.7 0 0 0-1-1.53 1.7 1.7 0 0 0-1.86.34l-.03.03a2 2 0 1 1-2.83-2.83l.03-.03A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.53-1H3a2 2 0 0 1 0-4h.07a1.7 1.7 0 0 0 1.53-1 1.7 1.7 0 0 0-.34-1.86l-.03-.03a2 2 0 1 1 2.83-2.83l.03-.03A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.07V3a2 2 0 0 1 4 0v.07a1.7 1.7 0 0 0 1 1.53 1.7 1.7 0 0 0 1.86-.34l.03-.03a2 2 0 1 1 2.83 2.83l-.03.03A1.7 1.7 0 0 0 19.4 9c0 .46.17.9.46 1.24.3.33.74.53 1.21.56H21a2 2 0 0 1 0 4h-.07a1.7 1.7 0 0 0-1.53 1z" stroke="currentColor" stroke-width="1.5" fill="none" />
        </svg>
      </button>

    </header>
