    <!-- Signal Path Bar -->
    <section class="signal-path-bar film-grain" id="signal-path-bar">
      <button class="signal-path-collapse-btn" id="signal-path-collapse-btn" type="button"
        aria-expanded="true" aria-label="Collapse signal chain" title="Collapse signal chain">
        <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
          <path d="M3.5 5.75 8 10.25l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="signal-path-collapsed-label" aria-hidden="true"><span>SIGNAL CHAIN</span></span>
      </button>
      <button class="signal-path-wrap-btn" id="signal-path-wrap-btn" type="button"
        aria-pressed="false" aria-label="Wrap signal chain" title="Wrap the signal chain onto more lines">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
          <path d="M2 3.5h12M2 8h9.25a2.25 2.25 0 0 1 0 4.5H7.5M9.25 10.75 7.5 12.5l1.75 1.75M2 12.5h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="signal-path-body">
      <!-- Composite edit mode banner -->
      <div class="composite-edit-banner" id="composite-edit-banner" style="display: none;">
        <span class="composite-edit-banner-label">Editing Composite:</span>
        <span class="composite-edit-banner-name" id="composite-edit-banner-name"></span>
        <span class="composite-edit-banner-hint">Use the signal chain below to add/remove/configure effects</span>
      </div>
      <div class="signal-path-visualizer">
        <div class="signal-path-scroll scrollbar-thin">
          <div class="signal-path-nodes" id="signal-path-nodes">
            <!-- Signal path nodes will be rendered here by JavaScript (or x-for in future) -->
            <div class="signal-node input-node" data-node-id="__input__" title="Input" aria-label="Input">
              <div class="node-icon"><span class="fx-effect-icon" style="--icon-url: url('/images/icons/amp.svg')" aria-hidden="true"></span>
              </div>
              <span class="node-label">Input</span>
            </div>
            <div class="signal-connector"></div>
            <div class="signal-node" data-node-id="placeholder" title="No Preset" aria-label="No Preset">
              <div class="node-icon"><span class="fx-effect-icon" style="--icon-url: url('/images/icons/bolt.svg')" aria-hidden="true"></span>
              </div>
              <span class="node-label">No Preset</span>
            </div>
            <div class="signal-connector"></div>
            <div class="signal-node output-node" data-node-id="__output__" title="Output" aria-label="Output">
              <div class="node-icon"><span class="fx-effect-icon" style="--icon-url: url('/images/icons/speaker.svg')" aria-hidden="true"></span>
              </div>
              <span class="node-label">Output</span>
            </div>
          </div>
        </div>
        <div class="signal-path-add-menu" id="signal-path-add-menu">
          <button
            class="signal-path-add-menu-trigger"
            id="signal-path-add-menu-trigger"
            type="button"
            aria-expanded="false"
            aria-haspopup="menu"
            aria-label="Add to signal chain"
            title="Add to signal chain"
          >
            <span aria-hidden="true">+</span>
          </button>
          <div class="signal-path-add-menu-options" id="signal-path-add-menu-options" role="menu" hidden>
            <button type="button" role="menuitem" id="signal-path-floating-add-fx">Add FX…</button>
            <button type="button" role="menuitem" id="signal-path-add-scene">Add Scene…</button>
          </div>
        </div>
      </div>
      <div
        class="signal-path-resize-handle"
        id="signal-path-resize-handle"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Signal chain display mode"
        aria-valuemin="48"
        aria-valuemax="96"
        aria-valuenow="96"
        aria-valuetext="Full signal chain"
        title="Drag up for compact signal chain or down for full (double-click for full)"
        tabindex="0"
      >
        <span class="signal-path-resize-handle-grip" aria-hidden="true"></span>
      </div>
      <div class="signal-path-toolbar" id="signal-path-toolbar">
        <div class="signal-path-scene-toolbar" id="signal-path-scene-toolbar"></div>
      </div>
      </div>
    </section>
