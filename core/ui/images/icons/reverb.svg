<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e9edf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Room/plate reverb: energy concentrated in the middle, symmetric decay
       either side. Same six-bar construction as reverb-advanced.svg and
       reverb-ambient.svg so the three read as one family; the previous eleven
       bars at stroke-width 1.5 filled in to a solid diamond at 18px. -->
  <line x1="2"  y1="10"  x2="2"  y2="14"/>
  <line x1="6"  y1="6.5" x2="6"  y2="17.5"/>
  <line x1="10" y1="2"   x2="10" y2="22"/>
  <line x1="14" y1="2"   x2="14" y2="22"/>
  <line x1="18" y1="6.5" x2="18" y2="17.5"/>
  <line x1="22" y1="10"  x2="22" y2="14"/>
</svg>
