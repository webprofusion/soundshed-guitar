<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e9edf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- One hit and its equal-level copy, staggered: same height (not a decay,
       so it reads against delay.svg) and offset in both time and channel, so
       the pair cannot be mistaken for a pause glyph. -->
  <line x1="8"  y1="3"  x2="8"  y2="14"/>
  <line x1="16" y1="10" x2="16" y2="21"/>
</svg>
