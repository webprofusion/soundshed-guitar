<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e9edf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Algorithmic reverb: sharp attack, exponential decay. The mirror of
       reverb-ambient.svg. Six bars at 4-unit spacing, not the eleven of
       reverb.svg — at 18px a denser comb fills in to a solid triangle. -->
  <line x1="2"  y1="2"    x2="2"  y2="22"/>
  <line x1="6"  y1="5"    x2="6"  y2="19"/>
  <line x1="10" y1="7"    x2="10" y2="17"/>
  <line x1="14" y1="8.5"  x2="14" y2="15.5"/>
  <line x1="18" y1="9.5"  x2="18" y2="14.5"/>
  <line x1="22" y1="10.5" x2="22" y2="13.5"/>
</svg>
