# Uncrustify config for GuitarFX — blank-line rules ONLY.
#
# WHY THIS EXISTS
# clang-format has no option that inserts blank lines before or after a control
# statement, so the vertical-whitespace conventions in
# .github/copilot-instructions.md cannot be enforced by .clang-format alone.
# Uncrustify can insert them; clang-format then preserves them
# (MaxEmptyLinesToKeep), so the two compose.
#
# HOW TO RUN — uncrustify FIRST, clang-format SECOND, always both:
#   uncrustify -c tools/uncrustify.cfg -l CPP --no-backup <files>
#   clang-format --style=file -i <files>
# Running uncrustify without the clang-format pass afterwards will leave layout
# that does not match .clang-format.
#
# SCOPE: core/ only. juce/ has its own formatting rules — leave it alone.
#
# Every option not listed here is left at uncrustify's default of "ignore" on
# purpose: clang-format stays the authority on all other layout. Only add an
# option here if clang-format genuinely cannot express it.

# Match .clang-format so the intermediate state is reviewable.
indent_with_tabs  = 0
indent_columns    = 4

# Rule 1: a blank line before a control statement.
nl_before_if      = add
nl_before_for     = add
nl_before_while   = add
nl_before_switch  = add
nl_before_do      = add

# Rule 2: a blank line after one.
nl_after_if       = add
nl_after_for      = add
nl_after_while    = add
nl_after_switch   = add
nl_after_do       = add

# The "except at the start or end of a scope" exception for both rules.
eat_blanks_after_open_brace   = true
eat_blanks_before_close_brace = true

# NOT COVERED: blank lines around an enum declaration. Uncrustify's nl_before_*
# family has entries for struct, class and namespace but none for enum, and
# nl_before_struct/nl_after_struct were verified not to reach enums. That rule
# stays a hand-maintained convention.

# Leave multi-line comments completely alone. With the default (true) uncrustify
# re-indents block-comment bodies by one column but leaves their nested
# continuation lines untouched, which breaks the alignment of any indented
# sub-list and produced ~418 lines of pure churn on the first attempt.
cmt_indent_multi = false
