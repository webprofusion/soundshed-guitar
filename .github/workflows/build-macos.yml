name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    env:
      R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Set up a temporary keychain with the signing certificates.
      # We manage the keychain manually (rather than via the sudara composite
      # action) so that we retain the keychain password as a step output.
      # That password is needed to re-unlock the keychain right before
      # productsign: unlike codesign, productsign has no --keychain flag and
      # will block forever on a GUI password prompt if the keychain is locked.
      - name: Import signing certificates
        id: keychain
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="github-action-build-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
          KEYCHAIN_PATH="$HOME/Library/Keychains/${KEYCHAIN_NAME}.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 18)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "keychain-path=$KEYCHAIN_PATH"         >> "$GITHUB_OUTPUT"
          echo "keychain-password=$KEYCHAIN_PASSWORD" >> "$GITHUB_OUTPUT"

          # Create and unlock; disable all auto-lock so the keychain never
          # re-locks during a long build step.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"   # no -l/-u → never auto-lock

          # Import Developer ID Application certificate.
          APP_CERT=$(mktemp)
          printf '%s' '${{ secrets.DEV_ID_APP_CERT }}' | base64 -d > "$APP_CERT"
          security import "$APP_CERT" -f pkcs12 -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.DEV_ID_APP_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$APP_CERT"

          # Import Developer ID Installer certificate.
          INST_CERT=$(mktemp)
          printf '%s' '${{ secrets.DEV_ID_INSTALLER_CERT }}' | base64 -d > "$INST_CERT"
          security import "$INST_CERT" -f pkcs12 -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.DEV_ID_INSTALLER_PASSWORD }}" \
            -T /usr/bin/pkgbuild -T /usr/bin/productbuild \
            -T /usr/bin/productsign -T /usr/bin/security
          rm -f "$INST_CERT"

          # Allow all Apple signing tools to use the imported keys without
          # triggering an interactive authorisation dialog.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to the user's keychain search list without changing the default.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | xargs)

      - name: Install Typescript
        run: npm install -g typescript
      
      - name: Build universal artifacts (no pkg)
        run: |
          chmod +x ./build_macos.sh
          ./build_macos.sh --universal --no-pkg

      - name: Prune bundled ui non-runtime files (pre-sign)
        run: |
          set -euo pipefail
          ARTEFACTS="juce/builds/SoundshedGuitar_artefacts/Release"
          removed=0

          while IFS= read -r -d '' ui_dir; do
            rm -rf \
              "$ui_dir/node_modules" \
              "$ui_dir/ts" \
              "$ui_dir/tests" \
              "$ui_dir/Testing" \
              "$ui_dir/scripts" \
              "$ui_dir/ui-components"
            rm -f \
              "$ui_dir/package.json" \
              "$ui_dir/package-lock.json" \
              "$ui_dir/tsconfig.json" \
              "$ui_dir/tsconfig.eslint.json" \
              "$ui_dir/vitest.config.ts" \
              "$ui_dir/eslint.config.mjs" \
              "$ui_dir/.prettierrc.json" \
              "$ui_dir/index.template.html"
            removed=$((removed + 1))
            echo "Pruned non-runtime UI files → $ui_dir"
          done < <(find "$ARTEFACTS" -type d -path "*/Contents/Resources/ui" -print0)

          echo "Pruned $removed ui director$( [[ $removed -eq 1 ]] && echo 'y' || echo 'ies' ) before signing"

      - name: Sign built bundles
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ARTEFACTS="juce/builds/SoundshedGuitar_artefacts/Release"
          PRODUCT="Soundshed Guitar"

          sign_if_exists() {
            local path="$1"
            local entitlements="${2:-}"
            if [[ -e "$path" ]]; then
              local args=(--force --keychain "${{ steps.keychain.outputs.keychain-path }}" -s "${{ secrets.DEVELOPER_ID_APPLICATION }}" --deep --strict --options runtime --timestamp)
              if [[ -n "$entitlements" ]]; then
                args+=(--entitlements "$entitlements")
              fi
              codesign "${args[@]}" "$path"
            fi
          }

          sign_if_exists "$ARTEFACTS/Standalone/$PRODUCT.app" "core/macos.standalone.entitlements"
          sign_if_exists "$ARTEFACTS/VST3/$PRODUCT.vst3"
          sign_if_exists "$ARTEFACTS/AU/$PRODUCT.component"
          sign_if_exists "$ARTEFACTS/CLAP/$PRODUCT.clap"
          sign_if_exists "$ARTEFACTS/AAX/$PRODUCT.aaxplugin"

      - name: Build macOS installer package
        run: ./build_macos.sh --skip-ts --skip-build --pkg

      # Re-unlock the keychain immediately before calling productsign.
      # productsign has no --keychain flag; it searches the user keychain list
      # and will block forever on a GUI password prompt if the keychain is
      # locked.  After the long build and bundle-signing steps the keychain can
      # re-lock, so we unlock it explicitly here using the password we saved
      # as a step output during setup.
      - name: Unlock signing keychain before productsign
        run: security unlock-keychain -p "${{ steps.keychain.outputs.keychain-password }}" "${{ steps.keychain.outputs.keychain-path }}"

      - name: Sign installer package
        id: pkg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          VERSION="$(cat juce/VERSION)"
          UNSIGNED_PKG="macos-dist/SoundshedGuitar-${VERSION}.pkg"
          SIGNED_PKG="macos-dist/SoundshedGuitar-${VERSION}-macOS-universal.pkg"

          productsign --sign "${{ secrets.DEVELOPER_ID_INSTALLER }}" "$UNSIGNED_PKG" "$SIGNED_PKG"

          echo "pkg_path=$SIGNED_PKG" >> "$GITHUB_OUTPUT"
          echo "pkg_name=$(basename "$SIGNED_PKG")" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple package
        run: |
          set -euo pipefail
          xcrun notarytool submit "${{ steps.pkg.outputs.pkg_path }}" \
            --apple-id "${{ secrets.NOTARIZATION_USERNAME }}" \
            --password "${{ secrets.NOTARIZATION_PASSWORD }}" \
            --team-id "${{ secrets.TEAM_ID }}" \
            --wait

          xcrun stapler staple "${{ steps.pkg.outputs.pkg_path }}"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-universal-pkg
          path: ${{ steps.pkg.outputs.pkg_path }}
          if-no-files-found: error

      - name: Install Wrangler
        if: ${{ env.R2_BUCKET != '' }}
        run: npm install -g wrangler@4

      - name: Upload artifact to Cloudflare R2
        if: ${{ env.R2_BUCKET != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          key="builds/${{ github.ref_name }}/${{ github.run_id }}/macos/universal/${{ steps.pkg.outputs.pkg_name }}"
          wrangler r2 object put "$R2_BUCKET/$key" --file "${{ steps.pkg.outputs.pkg_path }}" --remote

      - name: Remove temporary signing keychain
        if: always()
        run: |
          # Remove from search list, then delete – ignore errors so cleanup
          # never masks an earlier failure.
          security list-keychains -d user -s \
            $(security list-keychains -d user \
              | grep -v "${{ steps.keychain.outputs.keychain-path }}" \
              | xargs) || true
          security delete-keychain "${{ steps.keychain.outputs.keychain-path }}" || true
