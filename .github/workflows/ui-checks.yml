name: UI checks

# The WebView UI had no automated gate of any kind: none of the platform build
# workflows run the TypeScript typecheck or the vitest suite, so the unit tests
# only ever ran when someone remembered to run them locally. This job is fast
# (no C++ toolchain) and gates every change to core/ui.
#
# Not covered here: the live-boot smoke test in tools/agent-ui-debug, which
# needs a built Standalone binary and a desktop session. Run it locally before
# merging anything that touches module structure — it is the only check that
# catches an import-cycle TDZ crash. See docs/agent-quickstart.md.

on:
  push:
    paths:
      - "core/ui/**"
      - ".github/workflows/ui-checks.yml"
  pull_request:
    paths:
      - "core/ui/**"
      - ".github/workflows/ui-checks.yml"
  workflow_dispatch:

concurrency:
  group: ui-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: core/ui

jobs:
  checks:
    name: typecheck, lint, tests, structure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Import cycles
        run: npm run check:cycles

      - name: File size budget
        run: npm run check:sizes

      - name: Build bundle
        run: npm run build

      - name: Every stylesheet is linked
        run: node scripts/check-stylesheets.js
