name: UI checks

# The WebView UI had no automated gate of any kind: none of the platform build
# workflows run the TypeScript typecheck or the vitest suite, so the unit tests
# only ever ran when someone remembered to run them locally. This job is fast
# (no C++ toolchain) and gates every change to core/ui.
#
# Not covered here: the live-boot smoke test in tools/agent-ui-debug, which
# needs a built Standalone binary and a desktop session. Run it locally before
# merging anything that touches module structure — it is the only check that
# catches an import-cycle TDZ crash. See docs/agent-quickstart.md.

on:
  push:
    paths:
      - "core/ui/**"
      - "core/protocol/**"
      - "tools/check-protocol.mjs"
      - "tools/gen-effect-presentation.mjs"
      - "tools/check-effect-presentation.mjs"
      - "tools/gen-pickup-sensing.mjs"
      - "core/src/dsp/effects/PickupSensing.generated.h"
      - "core/src/dsp/EffectGuids.h"
      - ".github/workflows/ui-checks.yml"
  pull_request:
    paths:
      - "core/ui/**"
      - "core/protocol/**"
      - "tools/check-protocol.mjs"
      - "tools/gen-effect-presentation.mjs"
      - "tools/check-effect-presentation.mjs"
      - "tools/gen-pickup-sensing.mjs"
      - "core/src/dsp/effects/PickupSensing.generated.h"
      - "core/src/dsp/EffectGuids.h"
      - ".github/workflows/ui-checks.yml"
  workflow_dispatch:

concurrency:
  group: ui-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: core/ui

jobs:
  checks:
    name: typecheck, lint, tests, structure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: core/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Import cycles
        run: npm run check:cycles

      - name: uiState write ownership
        run: npm run check:state-writes

      - name: UI/engine protocol
        run: npm run check:protocol

      - name: Effect presentation table
        run: npm run check:presentation

      # Pickup Match's string-sensing table is generated from physics alone, so it can be checked.
      - name: Pickup sensing table
        run: npm run check:pickup-sensing

      - name: File size budget
        run: npm run check:sizes

      - name: Build bundle
        run: npm run build

      - name: Every stylesheet is linked
        run: node scripts/check-stylesheets.js

      # Themes restyle through tokens; literal colours and per-theme rules may only shrink.
      - name: Theme ratchet
        run: npm run check:theme-ratchet
