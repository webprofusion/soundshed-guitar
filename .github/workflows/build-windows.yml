name: Build Windows

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: "Target architecture to build (x64, arm64, or both)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - x64
          - arm64
      avx_variant:
        description: "x64 SIMD baseline: avx2 (standard), avx (Sandy Bridge / Bulldozer 2011+), noavx (no AVX at all), or all"
        required: false
        default: "avx2"
        type: choice
        options:
          - avx2
          - avx
          - noavx
          - all
      upload_to_r2:
        description: "Also upload the build to Cloudflare R2"
        required: false
        default: false
        type: boolean
  # Called by build-all.yml. A called workflow cannot take a choice input, so
  # these are strings, with the same values as the choices above.
  workflow_call:
    inputs:
      target_arch:
        description: "x64, arm64, or both"
        required: false
        default: "both"
        type: string
      avx_variant:
        description: "avx2, avx, noavx, or all"
        required: false
        default: "avx2"
        type: string
      upload_to_r2:
        description: "Also upload the build to Cloudflare R2"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate-signing-config:
    name: Validate signing config
    runs-on: ubuntu-latest
    steps:
      - name: Check KMS secrets are complete when signing is enabled
        env:
          HAS_GCP_AUTH: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAS_WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_CHAIN_PEM_B64 != '' }}
          HAS_KMS_CONFIG: ${{ secrets.GCP_KMS_KEY_ID != '' }}
        run: |
          if [[ "$HAS_GCP_AUTH" == "true" && "$HAS_WINDOWS_SIGNING_CERT" == "true" && "$HAS_KMS_CONFIG" != "true" ]]; then
            echo "::error::Signing is enabled (GCP auth + certificate present) but the KMS secret is missing."
            echo "::error::Ensure the following secret is set: GCP_KMS_KEY_ID (full resource path, e.g. projects/PROJECT/locations/LOCATION/keyRings/KEYRING/cryptoKeys/KEY/cryptoKeyVersions/VERSION)"
            exit 1
          fi
          echo "Signing configuration is valid."

  build:
    name: windows-${{ matrix.arch }}${{ matrix.avx == 'avx2' && '' || format('-{0}', matrix.avx) }}
    runs-on: windows-latest
    needs: validate-signing-config
    strategy:
      fail-fast: false
      matrix:
        # Resolves to ["x64"], ["arm64"], or ["x64","arm64"] based on the target_arch input (default: both).
        # inputs, not github.event.inputs: when called, the event is the caller's, with the caller's inputs.
        arch: ${{ inputs.target_arch == 'x64' && fromJSON('["x64"]') || inputs.target_arch == 'arm64' && fromJSON('["arm64"]') || fromJSON('["x64","arm64"]') }}
        # Resolves to a single tier, or all three, based on the avx_variant input (default: avx2)
        avx: ${{ inputs.avx_variant == 'avx' && fromJSON('["avx"]') || inputs.avx_variant == 'noavx' && fromJSON('["noavx"]') || inputs.avx_variant == 'all' && fromJSON('["avx2","avx","noavx"]') || fromJSON('["avx2"]') }}
        exclude:
          # The x86-64 SIMD baseline never applies to arm64, which picks its own
          # /arch:armv8.x, so these would be duplicates of the standard build.
          - arch: arm64
            avx: avx
          - arch: arm64
            avx: noavx

    env:
      # Empty, so the R2 steps are skipped, unless upload_to_r2 is ticked.
      R2_BUCKET: ${{ inputs.upload_to_r2 && vars.CLOUDFLARE_R2_BUCKET || '' }}
      HAS_GCP_AUTH: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
      HAS_WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_CHAIN_PEM_B64 != '' }}
      HAS_KMS_CONFIG: ${{ secrets.GCP_KMS_KEY_ID != '' }}
      HAS_R2_CREDENTIALS: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Typescript
        run: npm install -g typescript

      - name: Build Windows installer
        shell: pwsh
        env:
          # Bundled into the build at configure time; empty leaves Jam search unavailable.
          GUITARFX_JAM_YOUTUBE_API_KEY: ${{ secrets.JAM_YOUTUBE_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GUITARFX_WINDOWS_CMAKE_GENERATOR = 'Visual Studio 18 2026'
          # The workflow calls the sse2 tier "noavx" so the installer filename reads well.
          $simd = switch ('${{ matrix.avx }}') { 'noavx' { 'sse2' } 'avx' { 'avx' } default { 'avx2' } }
          $buildArgs = @('${{ matrix.arch }}', '--simd', $simd)
          Write-Host "Running build_windows.bat $buildArgs"
          .\build_windows.bat @buildArgs

      - name: Validate plugin formats (pluginval, clap-validator)
        # The arm64 leg cross-compiles on an x64 runner, so its plugins cannot be
        # loaded here; the x64 legs cover every SIMD tier the runner can execute.
        if: ${{ matrix.arch == 'x64' }}
        shell: pwsh
        run: node tools/validate-plugins.mjs --config Release

      - name: Upload validation logs
        if: ${{ failure() && matrix.arch == 'x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs-windows-${{ matrix.arch }}${{ matrix.avx == 'avx2' && '' || format('-{0}', matrix.avx) }}
          path: juce/builds/validation
          if-no-files-found: ignore

      - name: Resolve installer path
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path '.\juce\packaging\Output' -Filter '*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw 'No Windows installer .exe found in juce\\packaging\\Output'
          }

          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate to Google Cloud
        if: ${{ env.HAS_GCP_AUTH == 'true' }}
        uses: google-github-actions/auth@v2
        with:
            project_id:  ${{ secrets.GCP_PROJECT_ID }}
            create_credentials_file: true
            export_environment_variables: true
            access_token_lifetime: 600
            workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
            service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: ${{ env.HAS_GCP_AUTH == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Cloud KMS CNG provider
        if: ${{ env.HAS_GCP_AUTH == 'true' && env.HAS_WINDOWS_SIGNING_CERT == 'true' && env.HAS_KMS_CONFIG == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cngZip = Join-Path $env:RUNNER_TEMP 'kmscng.zip'
          $cngDir = Join-Path $env:RUNNER_TEMP 'kmscng'
          Invoke-WebRequest -Uri 'https://github.com/GoogleCloudPlatform/kms-integrations/releases/download/cng-v1.4/kmscng-1.4-windows-amd64.zip' -OutFile $cngZip
          Expand-Archive -Path $cngZip -DestinationPath $cngDir -Force

          $msi = Get-ChildItem -Path $cngDir -Filter '*.msi' -Recurse | Select-Object -First 1
          if (-not $msi) {
            throw 'kmscng.msi not found in the downloaded CNG provider archive'
          }

          $installLog = Join-Path $env:RUNNER_TEMP 'kmscng-install.log'
          $proc = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', "`"$($msi.FullName)`"", '/quiet', '/norestart', '/log', "`"$installLog`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content $installLog -ErrorAction SilentlyContinue
            throw "kmscng install failed with exit code $($proc.ExitCode)"
          }

      - name: Sign installer with SignTool (Google Cloud KMS)
        if: ${{ env.HAS_GCP_AUTH == 'true' && env.HAS_WINDOWS_SIGNING_CERT == 'true' && env.HAS_KMS_CONFIG == 'true' }}
        shell: pwsh
        env:
          GCP_KMS_KEY_ID: ${{ secrets.GCP_KMS_KEY_ID }}
          WINDOWS_SIGNING_CERT_CHAIN_PEM_B64: ${{ secrets.WINDOWS_SIGNING_CERT_CHAIN_PEM_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllBytes('.\codesign-chain.pem', [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_CHAIN_PEM_B64))

          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'signtool.exe' -Recurse |
            Where-Object { $_.FullName -like '*\x64\*' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw 'signtool.exe not found; ensure the Windows SDK is installed on the runner'
          }

          $installerPath = '${{ steps.installer.outputs.installer_path }}'

          & $signtool.FullName sign /v /debug /fd sha256 /t http://timestamp.digicert.com `
            /f .\codesign-chain.pem `
            /csp "Google Cloud KMS Provider" `
            /kc "$env:GCP_KMS_KEY_ID" `
            "$installerPath"

          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }

      - name: Prepare release asset
        id: asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content '.\juce\VERSION' -Raw).Trim()
          $variantSuffix = switch ('${{ matrix.avx }}') { 'noavx' { '-noavx' } 'avx' { '-avx' } default { '' } }
          $assetName = "Sepia-$version-Windows-${{ matrix.arch }}$variantSuffix-setup.exe"
          $assetPath = Join-Path $PWD $assetName
          Copy-Item '${{ steps.installer.outputs.installer_path }}' $assetPath -Force

          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}${{ matrix.avx == 'avx2' && '' || format('-{0}', matrix.avx) }}-installer
          path: ${{ steps.asset.outputs.asset_path }}
          if-no-files-found: error

      - name: Install Wrangler
        if: ${{ env.R2_BUCKET != '' }}
        shell: pwsh
        run: npm install -g wrangler@4

      - name: Upload artifact to Cloudflare R2
        if: ${{ env.R2_BUCKET != '' && env.HAS_R2_CREDENTIALS == 'true' }}
        shell: pwsh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = "builds/${{ github.ref_name }}/${{ github.run_id }}/windows/${{ matrix.arch }}/${{ steps.asset.outputs.asset_name }}"
          wrangler r2 object put "$env:R2_BUCKET/$key" --file "${{ steps.asset.outputs.asset_path }}" --remote
