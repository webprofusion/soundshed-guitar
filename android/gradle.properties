org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ABIs to build. The C++ project is large, so a single ABI is much faster while
# iterating. Override per invocation, e.g.
#   gradlew assembleDebug -Pssg.abis=x86_64          (emulator)
#   gradlew assembleDebug -Pssg.abis=arm64-v8a       (phone)
#   gradlew assembleRelease -Pssg.abis=arm64-v8a,x86_64
ssg.abis=arm64-v8a

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
