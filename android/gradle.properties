org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ABIs to build. The C++ project is large, so a single ABI is much faster while
# iterating. Override per invocation, e.g.
#   gradlew assembleDebug -Pssg.abis=x86_64          (emulator)
#   gradlew assembleDebug -Pssg.abis=arm64-v8a

# Which product the APK carries: "guitar" (the WebView app) or "nano" (Soundshed
# Guitar Nano, the native UI; installs beside the WebView app as com.soundshed.guitar.nano
# until it replaces it). Override per invocation, e.g.
#   gradlew assembleDebug -Pssg.product=nano -Pssg.abis=x86_64
ssg.product=guitar       (phone)
#   gradlew assembleRelease -Pssg.abis=arm64-v8a,x86_64
ssg.abis=arm64-v8a

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
